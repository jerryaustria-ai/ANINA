services:
  - type: web
    name: anina
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: MONGO_DB_NAME
        value: ANINA
      - key: XENDIT_SIMULATION
        value: "true"
      - key: APP_BASE_URL
        value: https://anina.onrender.com
      - key: ALLOW_DEV_LOGIN
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: XENDIT_SECRET_KEY
        sync: false
      - key: XENDIT_WEBHOOK_TOKEN
        sync: false
      - key: VAT_RATE
        value: "0"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_LOGO_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_PHONE
        sync: false
